[package]
name = "fastdyn_fuzzer"
version = "0.15.4"
authors = [
  "Arslan Khan <arslankhan52@gmail.com>",
]
edition = "2021"

[lib]
name = "fastdyn_fuzzer"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["std", "bloom_input_filter"]
tui = ["libafl/tui_monitor"]
bloom_input_filter = ["std"]
std = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[dependencies]
libafl = { path = "../../../crates/libafl/" }
libafl_bolts = { path = "../../../crates/libafl_bolts/" }
memmap2 = "0.9"
once_cell = "1.21.3"
lazy_static = "1.4"

banquo = "0.1.0"
csv = "1.4.0"
env_logger = "0.11.7"
gz-msgs = "0.9.0"
gz-transport = "0.9.0"

log = { version = "0.4.22", features = ["release_max_level_info"] }
ordered-float = "5.1.0"
protobuf = "3.7.2"
scirs2-core = "0.1.1"
scirs2-optimize = "0.1.1"
serde = "1.0.228"
serde_json = "1.0.149"
# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]
main_ram_size = "512M"
shared_ram_size = "512K"
ram_base_addr = "0x20000000"
shared_ram_base_addr = "0x30000000"
shared_mem_path = "/dev/shm"        # Directory for memory backend files
main_ram_file = "my_m4_ram3"      # Filename for the main RAM backend
shared_ram_file = "my_m4_ram"     # Filename for the shared RAM backend

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[CPU]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m7"
plugin_library = "/data/fastdyn/build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf" # The VMM-like monitor that runs with the target
platform = "STM32F469"
binary = "/home/faculty/abk6349/data/fastdyn/device_models/server_firmwares/stm32f4/RTOSDemo.axf"

# --- Debugging, Control, and Logging ---
enable_gdb = true
stop_on_start = true
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# --- Virtual Instructions (Structured) ---
# Each block defines a single virtual instruction to be registered.
[[CPU.virtuals]]
at = "main+8"
instruction = "raiseirq"
args = ["TIM1_BRK_TIM9"]

# --- Instruction Modifiers (Structured) ---
# Each block defines a runtime binary patch using a high-level representation.
[[CPU.modifiers]]
at = "main+2"
patch = "r2 <- r3"

[[CPU.modifiers]]
at = "main+4"
patch = "r15 <- r14"


# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
# Define the global arguments for each type of plugin device model here.

[Device.Models.elder]
    # The libhw backend is a global argument for the elder model.

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]
    # The classic model has no global arguments.

[Device.Models.unhandled]
    # This model explicitly marks memory as unhandled.


# --- Peripheral Definitions ---
# Each peripheral gets its own sub-table. If it uses the elder model,
# its specific scroll configuration is defined directly within it.

[Device.uart]
    ranges = ["0x40011000-0x40011FFF"]
    description = "Main USART peripheral for serial communication."
    # The configuration for this specific device when handled by the elder model.
    # 'internal_model' is the name of the model compiled into the main plugin library.
    scroll_config = """
[uart]
internal_model = "uart_model"
"""
    # Define all models responsible for this device in the 'handlers' list.
    [[Device.uart.handlers]]
        model   = "qemu"
        type    = "stm32f2xx-usart" # QEMU-specific type
        enabled = true
        args = "device chardev"

    [[Device.uart.handlers]]
        model   = "elder"
        enabled = true
        scroll = "/home/faculty/abk6349/data/fastdyn/device_models/postmartem/verifier/gen.so"

    [[Device.uart.handlers]]
        model   = "passthrough"
        enabled = true # This handler is defined but will be skipped for this device.

[Device.gpio_g]
    ranges = ["0x40021800-0x40021BFF"]
    description = "GPIO Port G for general-purpose I/O."
    # The configuration for this specific device when handled by the elder model.
    [[Device.gpio_g.handlers]]
        # This device is now handled by the elder model, directly linking it
        # to the 'scroll_config' defined above.
        model   = "elder"
        enabled = true
        scroll = "/home/faculty/abk6349/data/fastdyn/device_models/postmartem/verifier/gen.so"

[Device.unhandled_space]
    ranges = ["0x40000000-0x40010FFF", "0xE0000000-0xEFFFFFFF"]
    description = "Memory regions that are explicitly not handled by any model."

    [[Device.unhandled_space.handlers]]
        model = "unhandled"
        enabled = true

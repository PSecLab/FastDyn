#NOTE: Multiple cpus options not supported by Fastdyn right now!
# ==============================================================================
# FastDyn Example Configuration (QEMU target)
# ==============================================================================


# ==============================================================================
# Machine (machine-wide + QEMU target options)
# ==============================================================================
[Machine]
platform = "STM32F429"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = false
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage = false
finline  = ""



# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  # ---------------------------------------------------------------------------
  # Main memory (required)
  #
  # Used by:  -machine <...>,memory-backend=<id>
  # Also maps: ram_baseaddr0 / ram_backend0
  # ---------------------------------------------------------------------------
  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"                 # file | ram | memfd
  memory_file = "/dev/shm/my_m4_ram3"  # only when backend="file"

  share    = true
  prealloc = false


  # ---------------------------------------------------------------------------
  # Extra memory banks (optional)
  #
  # Each bank becomes:
  #   -object memory-backend-*
  #   -global <machine>-soc.ram_baseaddrN=<base_address>
  #   -global <machine>-soc.ram_backendN=<id>
  # ---------------------------------------------------------------------------
  [[Memory.banks]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false



# ==============================================================================
# CPUs
# ==============================================================================
[CPU]

  # ---------------------------------------------------------------------------
  # CPU 0
  # ---------------------------------------------------------------------------
  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  binary      = "boardrunner/boardrunner_examples/examples/STM32F429i-disc1/gpio/firmwares/gpio.axf"
  init_nsvtor = "0x08000000"

  map_file       = "/home/hammad/work/rehosting/FastDyn/courbet/rover_v422_map.txt"
  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = DEBUG
  # output = stderr
  """


    # -------------------------------------------------------------------------
    # Virtual instructions for CPU 0
    # -------------------------------------------------------------------------
    [[CPU.cpu0.virtuals]]
    at          = "main+8"
    instruction = "raiseirq"
    args        = ["TIM1_BRK_TIM9"]

    [[CPU.cpu0.virtuals]]
    at          = "0x8003940"
    instruction = "anchor"
    args        = ["/tmp/input_fastdyn:0x0"]

    [[CPU.cpu0.virtuals]]
    at          = "0x800395e"
    instruction = "assert"
    args        = ["*main+4", "TIM1_BRK_TIM9"]


    # -------------------------------------------------------------------------
    # Modifiers (runtime patches) for CPU 0
    # -------------------------------------------------------------------------
    [[CPU.cpu0.modifiers]]
    at    = "0x0800395c"
    patch = "r15 <- main+8"



  # ---------------------------------------------------------------------------
  # CPU 1 (additional CPU example)
  #
  # Notes:
  # - Multiple CPUs share the same Machine/QEMU instance.
  # - In the current QEMU runner, multi-CPU is treated as SMP, so keep these
  #   fields consistent across CPUs (machine/cpu/binary/arch) unless you have
  #   explicit heterogeneous support.
  # ---------------------------------------------------------------------------
  [[CPU.cpu1]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  binary      = "boardrunner/boardrunner_examples/examples/STM32F429i-disc1/gpio/firmwares/gpio.axf"
  init_nsvtor = "0x08000000"

  map_file       = "/home/hammad/work/rehosting/FastDyn/courbet/rover_v422_map.txt"
  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = INFO
  # output = stderr
  """


    # -------------------------------------------------------------------------
    # Virtual instructions for CPU 1 (example placeholders)
    # -------------------------------------------------------------------------
    [[CPU.cpu1.virtuals]]
    at          = "0x8003A00"
    instruction = "anchor"
    args        = ["/tmp/input_fastdyn:0x100"]


    # -------------------------------------------------------------------------
    # Modifiers (runtime patches) for CPU 1 (example placeholder)
    # -------------------------------------------------------------------------
    [[CPU.cpu1.modifiers]]
    at    = "0x08003A10"
    patch = "r0 <- 0x1"



# ==============================================================================
# Device model defaults (global settings per model type)
# ==============================================================================
[Device.Models]

  [Device.Models.elder]
  # (empty by default)

  [Device.Models.passthrough]
  backend = "stlink"

  [Device.Models.classic]
  # (empty by default)

  [Device.Models.unhandled]
  # (empty by default)



# ==============================================================================
# Devices (per peripheral / region)
# ==============================================================================
[Device]

  # ---------------------------------------------------------------------------
  # GPIOG
  # ---------------------------------------------------------------------------
  [Device.gpiog]
  ranges = [
    ["0x40021800", "0x40021BFF"],
  ]

  # mix of inclusive ranges + single IRQs
  irq = [
    [0, 10],
    [20, 30],
    45,
    100,
  ]

  description   = "GPIO Port G for general-purpose I/O."
  read_priority = "elder"


    [[Device.gpiog.handlers]]
    model   = "elder"
    enabled = false
    scroll  = "/scratch/Fastdyn/FastDyn/device_models/postmartem/verifier/gen.so"

    [[Device.gpiog.handlers]]
    model   = "passthrough"
    enabled = true


  # ---------------------------------------------------------------------------
  # Explicitly unhandled regions
  # ---------------------------------------------------------------------------
  [Device.unhandled_space]
  ranges = [
    ["0x40000000", "0x400217FF"],
    ["0x40021C00", "0xE00FFFFF"],
    ["0xE0000000", "0xEFFFFFFF"],
  ]

  description = "Memory regions that are explicitly not handled by any model."


    [[Device.unhandled_space.handlers]]
    model   = "passthrough"
    enabled = true

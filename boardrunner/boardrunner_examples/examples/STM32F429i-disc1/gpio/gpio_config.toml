# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]   # required: goes to -machine ... memory-backend=<id>
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"          # file | ram | memfd
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]   # optional banks: go to -global cortexm-soc.ram_backendN / ram_baseaddrN
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32F429"
# --- Debugging, Control, and Logging ---
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=false
finline='None'

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m4"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf" # The VMM-like monitor that runs with the target
binary = "boardrunner/boardrunner_examples/examples/STM32F429i-disc1/gpio/firmwares/gpio.axf"
init_nsvtor = "0x08000000"
map_file = "/home/hammad/work/rehosting/FastDyn/courbet/rover_v422_map.txt"
twintrace = "replay" #options are record, replay or None
hardware_trace = '/home/hammad/work/rehosting/FastDyn/hardware_log/io.log'   #useful in cases like replay to generate the replay binary

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
# Define the global arguments for each type of plugin device model here.

[Device.Models.elder]
    # The libhw backend is a global argument for the elder model.

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]
    # The classic model has no global arguments.

[Device.Models.twintrace]
    backend = "stlink"
    # The classic model has no global arguments.

[Device.Models.unhandled]
    # This model explicitly marks memory as unhandled.

# --- Peripheral Definitions ---
# Each peripheral gets its own sub-table. If it uses the elder model,
# its specific scroll configuration is defined directly within it.
[Device.gpiog]
    # ranges = ["0x40000000-0x40010FFF"]
    ranges = [["0x40021800", "0x40021BFF"]]

    description = "GPIO Port G for general-purpose I/O."
    read_priority = "elder"  #only the read from elder model is considered.
    # The configuration for this specific device when handled by the elder model.
    [[Device.gpiog.handlers]]
        # This device is now handled by the elder model, directly linking it
        # to the 'scroll_config' defined above.
        model   = "elder"
        enabled = false
        scroll = "/scratch/Fastdyn/FastDyn/device_models/postmartem/verifier/gen.so"

    [[Device.gpiog.handlers]]
        # This device is now handled by the elder model, directly linking it
        # to the 'scroll_config' defined above.
        model   = "twintrace"
        enabled = true

[Device.unhandled_space]
    ranges = [["0x40000000", "0x400217FF"],["0x40021C00", "0xE00FFFFF"], ["0xE0000000", "0xEFFFFFFF"]]

    description = "Memory regions that are explicitly not handled by any model."

    [[Device.unhandled_space.handlers]]
        model = "twintrace"
        enabled = true
# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]   # required: goes to -machine ... memory-backend=<id>
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"          # file | ram | memfd
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]   # optional banks: go to -global cortexm-soc.ram_backendN / ram_baseaddrN
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32H753x"
# --- Debugging, Control, and Logging ---
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=false
finline='None'

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m7"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf"
binary = "boardrunner/boardrunner_examples/examples/STM32H753zi/I2C/firmware/I2C_Firmware.elf"
init_nsvtor = "0x08000000"
map_file = "courbet/rover_v422_map.txt"
twintrace = "None"
hardware_trace = 'hardware_log/io.log'

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]


# --- Peripheral Definitions ---

# I2C1 — master controller model.
# SCL=PB8, SDA=PB9 (AF4). Polling mode, no DMA. Slave device (BME280) at
# 7-bit address 0x76. No GPIO CS line — I2C uses address-based selection.
[Device.i2c1]
    ranges = [["0x40005400", "0x400057FF"]] #handles i2c1 peripheral
    irq = ['3','15']
    description = "I2C Peripheral"
    read_priority = "elder"  #only the read from elder model is considered.
    # The configuration for this specific device when handled by the elder model.
    [[Device.i2c1.handlers]]
        # This device is now handled by the elder model, directly linking it
        # to the 'scroll_config' defined above.
        model   = "elder"
        enabled = true
        scroll = "boardrunner/boardrunner_sdk/build/model.so"

    [[Device.i2c1.slaves]]
        model = ["elder"]       #attach this device to elder model only
        device = "bme280"
        address = "0x76"
        device_scroll = "boardrunner/boardrunner_sdk/build/slave.so"

    [[Device.i2c1.handlers]]
        model   = "classic"
        enabled = false

    [[Device.i2c1.handlers]]
        # This device is now handled by the elder model, directly linking it
        # to the 'scroll_config' defined above.
        model   = "passthrough"
        enabled = false

    [[Device.i2c1.handlers]]
        model   = "twintrace"
        enabled = false

[Device.remaining_space]
    ranges = [["0x40000000", "0x400053FF"],["0x40005800", "0xE0000000"], ["0xE0000000", "0xEFFFFFFF"]]
    irq = ['3','15']
    description = "Memory regions that will handled by passthrough and are not of interest for the modeling."

    [[Device.remaining_space.handlers]]
        model = "classic"
        enabled = false

    [[Device.remaining_space.handlers]]
        model = "passthrough"
        enabled = true

    [[Device.remaining_space.handlers]]
        model = "twintrace"
        enabled = false
# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]   # required: goes to -machine ... memory-backend=<id>
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"          # file | ram | memfd
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]   # optional banks: go to -global cortexm-soc.ram_backendN / ram_baseaddrN
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32H753x"
# --- Debugging, Control, and Logging ---
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=false
finline='None'

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m7"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf" # The VMM-like monitor that runs with the target
binary = "boardrunner/boardrunner_examples/examples/STM32H753zi/ADC_with_DMA/firmwares/ADC_DMA_Transfer.elf"
init_nsvtor = "0x08000000"
map_file = "courbet/rover_v422_map.txt"
twintrace = "None" #options are record, replay or None
hardware_trace = 'hardware_log/io.log'   #useful in cases like replay to generate the replay binary

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# [[CPU.cpu0.virtuals]]
# at = "0x080004a2"
# instruction = "anchor"
# args = ["3"]

# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
# Define the global arguments for each type of plugin device model here.

[Device.Models.elder]
    # The libhw backend is a global argument for the elder model.

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]
    # The classic model has no global arguments.

[Device.Models.twintrace]
    backend = "stlink"
    # The classic model has no global arguments.

[Device.Models.unhandled]


# --- Peripheral Definitions ---

# Specific configuration for DMA1 and DMAMUX1
[Device.dma_with_dmamux1]
    ranges = [
        ["0x40020000", "0x400203FF"], # DMA1 Registers
        ["0x40020800", "0x40020BFF"]  # DMAMUX1 Registers (Required for DMA_REQUEST_ADC1)
    ]
    irq = [['1','100']]
    description = "DMA1 and DMAMUX1 peripherals for data transfer."
    read_priority = "elder"

    [[Device.dma_with_dmamux1.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/model2.so"

    [[Device.dma_with_dmamux1.handlers]]
        model   = "classic"
        enabled = false

    [[Device.dma_with_dmamux1.handlers]]
        model   = "passthrough"
        enabled = false

    [[Device.dma_with_dmamux1.handlers]]
        model   = "twintrace"
        enabled = false


# Specific configuration for ADC1
[Device.adc]
    ranges = [
        ["0x40022000", "0x400223FF"]  # ADC1 (and shared ADC2) Registers
    ]
    irq = [['1','100']]
    description = "ADC1 peripheral for analog data acquisition."
    read_priority = "elder"

    [[Device.adc.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/model.so"

    [[Device.adc.handlers]]
        model   = "classic"
        enabled = false

    [[Device.adc.handlers]]
        model   = "passthrough"
        enabled = false

    [[Device.adc.handlers]]
        model   = "twintrace"
        enabled = false


# Remaining memory regions to be passed through
[Device.remaining_space]
    ranges = [
        ["0x40000000", "0x4001FFFF"],
        ["0x40020400", "0x400207FF"], # Unused gap between DMA1 and DMAMUX1
        ["0x40020C00", "0x40021FFF"], # Unused gap between DMAMUX1 and ADC1
        ["0x40022400", "0xDFFFFFFF"], # Memory after ADC1 up to the 0xE0000000 boundary
        ["0xE0000000", "0xEFFFFFFF"]
    ]
    irq = [['1','100']]
    description = "Memory regions handled by passthrough (not of interest for active modeling)."

    [[Device.remaining_space.handlers]]
        model = "classic"
        enabled = false

    [[Device.remaining_space.handlers]]
        model = "passthrough"
        enabled = true

    [[Device.remaining_space.handlers]]
        model = "twintrace"
        enabled = false
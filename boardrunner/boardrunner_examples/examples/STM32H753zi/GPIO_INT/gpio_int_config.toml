# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]   # required: goes to -machine ... memory-backend=<id>
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"          # file | ram | memfd
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]   # optional banks: go to -global cortexm-soc.ram_backendN / ram_baseaddrN
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32H753x"
# --- Debugging, Control, and Logging ---
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=false
finline='None'

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m7"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf" # The VMM-like monitor that runs with the target
binary = "boardrunner/boardrunner_examples/examples/STM32H753zi/GPIO_INT/firmwares/GPIO_Demo.elf"
init_nsvtor = "0x08000000"
map_file = "courbet/rover_v422_map.txt"
twintrace = "None" #options are record, replay or None
hardware_trace = 'hardware_log/io.log'   #useful in cases like replay to generate the replay binary

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# [[CPU.cpu0.virtuals]]
# at = "0x080004a2"
# instruction = "anchor"
# args = ["3"]

# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]


# --- Peripheral Definitions ---

# Model 1: GPIOC — PC13 push button input.
# The model exposes PC13 as a PTY button and publishes the pin level to EXTI
# using api_signal_set(13, level). EXTI line 13 (signal ID 13) is the bridge
# between this model and the EXTI model below.
[Device.gpioc]
    ranges = [
        ["0x58020800", "0x58020BFF"]   # GPIOC registers (PC13 = push button input)
    ]
    irq = [['1','100']]
    description = "GPIOC peripheral: PC13 push button input. Publishes signal 13 via api_signal_set() to notify EXTI model."
    read_priority = "elder"

    [[Device.gpioc.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/model.so"

    [[Device.gpioc.handlers]]
        model   = "classic"
        enabled = false

    [[Device.gpioc.handlers]]
        model   = "passthrough"
        enabled = false

    [[Device.gpioc.handlers]]
        model   = "twintrace"
        enabled = false


# Model 2: EXTI — external interrupt controller only.
# Registers api_signal_register(13, ...) to receive the level published by the
# GPIOC model. On a rising-edge event (per RTSR1 config), raises IRQ 40
# (EXTI15_10_IRQn) via qemu_plugin_raise_irq(40 + 16, false).
# SYSCFG is left in passthrough: SYSCFG_EXTICR4 is only written once at init
# and the routing is already implicit in the signal ID convention (signal 13 =
# EXTI line 13 = PC13). SYSCFG also handles I/O compensation which must reach
# real hardware.
[Device.exti]
    ranges = [
        ["0x58000000", "0x580003FF"]   # EXTI registers (RTSR1, FTSR1, IMR1, EMR1, PR1)
    ]
    irq = [['1','100']]
    description = "EXTI interrupt controller. Subscribes to signal 13 from GPIOC model and raises EXTI15_10_IRQn (IRQ 40) to the CPU."
    read_priority = "elder"

    [[Device.exti.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/model2.so"

    [[Device.exti.handlers]]
        model   = "classic"
        enabled = false

    [[Device.exti.handlers]]
        model   = "passthrough"
        enabled = false

    [[Device.exti.handlers]]
        model   = "twintrace"
        enabled = false


# Remaining memory regions passed through to real hardware.
# SYSCFG (0x58000400-0x580007FF) is left here: it handles I/O compensation
# (SYSCFG_CCCSR, SYSCFG_PMCR) and EXTI routing init (SYSCFG_EXTICR4) which
# only needs to reach the hardware once and is not needed by the EXTI model.
# GPIOB (PB0=LED1, PB14=LED3) and GPIOE (PE1=LED2) are also left here so
# the LEDs respond on the physical board without needing a model.
[Device.remaining_space]
    ranges = [
        ["0x40000000", "0x57FFFFFF"],  # AHB1/AHB2/APB1/APB2 peripherals
        ["0x58000400", "0x580207FF"],  # SYSCFG + other APB4 + GPIOA + GPIOB (LED1, LED3)
        ["0x58020C00", "0xDFFFFFFF"],  # GPIOD, GPIOE (LED2), GPIOF-K, RCC, PWR, BDMA, etc.
        ["0xE0000000", "0xEFFFFFFF"]   # Cortex-M7 core debug peripherals
    ]
    irq = [['1','100']]
    description = "Memory regions handled by passthrough. Includes SYSCFG, GPIOB, GPIOE (LEDs work via real hardware)."

    [[Device.remaining_space.handlers]]
        model = "classic"
        enabled = false

    [[Device.remaining_space.handlers]]
        model = "passthrough"
        enabled = true

    [[Device.remaining_space.handlers]]
        model = "twintrace"
        enabled = false

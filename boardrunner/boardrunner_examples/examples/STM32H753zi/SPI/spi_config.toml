# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]   # required: goes to -machine ... memory-backend=<id>
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"          # file | ram | memfd
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]   # optional banks: go to -global cortexm-soc.ram_backendN / ram_baseaddrN
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32H753x"
# --- Debugging, Control, and Logging ---
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=false
finline='None'

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m7"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf"
binary = "boardrunner/boardrunner_examples/examples/STM32H753zi/SPI/firmwares/SPI_Firmware.elf"
init_nsvtor = "0x08000000"
map_file = "courbet/rover_v422_map.txt"
twintrace = "None"
hardware_trace = 'hardware_log/io.log'

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]


# --- Peripheral Definitions ---

# SPI1 — master controller model.
# Uses hardware NSS (PA4, AF5). The SPI peripheral asserts/deasserts NSS
# automatically when CSTART fires and EOT clears. No GPIOD model required.
[Device.spi1]
    ranges = [
        ["0x40013000", "0x400133FF"]   # SPI1 registers
    ]
    irq = [['1','100']]
    description = "SPI1 peripheral: master polling mode, 8-bit full-duplex. Hardware NSS on PA4 (SSOE=1 in CFG2). Transmits and receives 2 bytes per transaction with BME280 sensor."
    read_priority = "elder"

    [[Device.spi1.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/model.so"

        [[Device.spi1.slaves]]
            model         = ["elder"]
            device        = "bme280"
            cs_id         = 0
            device_scroll = "boardrunner/boardrunner_sdk/build/slave.so"

    [[Device.spi1.handlers]]
        model   = "classic"
        enabled = false

    [[Device.spi1.handlers]]
        model   = "passthrough"
        enabled = false

    [[Device.spi1.handlers]]
        model   = "twintrace"
        enabled = false


# Remaining memory regions passed through to real hardware.
# Includes:
#   GPIOA (0x58020000-0x580203FF) — PA4 NSS, PA5/PA6 SCK/MISO
#   GPIOB (0x58020400-0x580207FF) — PB0=LED1, PB5=MOSI, PB14=LED3
#   GPIOC (0x58020800-0x58020BFF) — PC13 user button (firmware waits for press)
#   GPIOD-K, GPIOE (0x58020C00-...) — passthrough (GPIOD no longer used for CS)
#   GPIOE (0x58021000-0x580213FF) — PE1=LED2
#   RCC, PWR, SYSCFG, Flash, etc.
[Device.remaining_space]
    ranges = [
        ["0x40000000", "0x40012FFF"],  # APB1/APB2 peripherals before SPI1
        ["0x40013400", "0xDFFFFFFF"],  # After SPI1: all GPIO, RCC, PWR, SYSCFG, etc.
        ["0xE0000000", "0xEFFFFFFF"]   # Cortex-M7 core debug peripherals
    ]
    irq = [['1','100']]
    description = "Memory regions handled by passthrough. Includes all GPIO banks (PA4 NSS, button, LEDs, SPI AF pins), RCC, PWR, SYSCFG."

    [[Device.remaining_space.handlers]]
        model = "classic"
        enabled = false

    [[Device.remaining_space.handlers]]
        model = "passthrough"
        enabled = true

    [[Device.remaining_space.handlers]]
        model = "twintrace"
        enabled = false

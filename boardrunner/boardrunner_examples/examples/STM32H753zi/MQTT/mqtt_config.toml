# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]   # required: goes to -machine ... memory-backend=<id>
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"          # file | ram | memfd
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]   # optional banks: go to -global cortexm-soc.ram_backendN / ram_baseaddrN
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
#                                Machine / CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32H753x"
# --- Debugging, Control, and Logging ---
qemu_path = "qemu-system-arm"
enable_gdb = true
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage = true
finline = 'None'

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m7"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf"
binary = "boardrunner/boardrunner_examples/examples/STM32H753zi/MQTT/firmware/mqtt_h753.elf"
init_nsvtor = "0x08000000"
map_file = "courbet/rover_v422_map.txt"
twintrace = "None"
hardware_trace = 'hardware_log/io.log'

logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

[[CPU.cpu0.virtuals]]
at = "0x8007a84"
instruction = "fuzz_mqtt_in"
args = [""]

[[CPU.cpu0.virtuals]]
at = "0x8007998"
instruction = "fuzz_sync_point"
args = [""]

[[CPU.cpu0.modifiers]] # skip to sync point, load from saved snapshots
at = "0x8007526"
patch = "r15 0x8007998"

[[CPU.cpu0.virtuals]]
at = "0x8007ac6"
instruction = "assert"
args = ["*0x0"]

# # Recommended modifier set:
# # keep the MQTT software path intact (transport init, CONNECT/SUBSCRIBE/YIELD,
# # and all packet parsing), while bypassing board-specific clock/UART hardware
# # setup and raw UART TX. `mqtt_transport_getdata` at 0x8007a74 is intentionally
# # left untouched so input injection can happen there.

# skip MPU helper calls in main
[[CPU.cpu0.modifiers]]
at = "0x8007532"
patch = "r15 0x8007536"

[[CPU.cpu0.modifiers]]
at = "0x800754c"
patch = "r15 0x8007550"

[[CPU.cpu0.modifiers]]
at = "0x8007552"
patch = "r15 0x8007556"

# skip the raw SCB cache-enable sequence and HAL_Init; this avoids
# HAL_SYSTICK_Config and HAL_NVIC_SetPriority hardware accesses too
[[CPU.cpu0.modifiers]]
at = "0x8007556"
patch = "r15 0x80075da"

# main: skip the raw PWR/VOS hardware prep and polling block before clock setup
[[CPU.cpu0.modifiers]]
at = "0x80075ee"
patch = "r15 0x800762a"

# HAL_RCC_OscConfig / HAL_RCC_ClockConfig: stub the callee entry itself to
# return HAL_OK. This is more robust than patching the callsite in main.
[[CPU.cpu0.modifiers]]
at = "0x80087f0"
patch = "r0 0"

[[CPU.cpu0.modifiers]]
at = "0x80087f0"
patch = "r15 r14"

[[CPU.cpu0.modifiers]]
at = "0x8008e98"
patch = "r0 0"

[[CPU.cpu0.modifiers]]
at = "0x8008e98"
patch = "r15 r14"

# BSP_LED_Init calls in main are board GPIO setup only
[[CPU.cpu0.modifiers]]
at = "0x8007696"
patch = "r15 0x800769a"

[[CPU.cpu0.modifiers]]
at = "0x800769c"
patch = "r15 0x80076a0"

[[CPU.cpu0.modifiers]]
at = "0x80076a2"
patch = "r15 0x80076a6"

# HAL UART setup is not needed when transport RX is injected and TX is stubbed
[[CPU.cpu0.modifiers]]
at = "0x80076c2"
patch = "r15 0x80076c6"

[[CPU.cpu0.modifiers]]
at = "0x80076c6"
patch = "r0 0"

[[CPU.cpu0.modifiers]]
at = "0x80076cc"
patch = "r15 0x80076d0"

[[CPU.cpu0.modifiers]]
at = "0x80076d0"
patch = "r0 0"

[[CPU.cpu0.modifiers]]
at = "0x80076da"
patch = "r15 0x80076de"

[[CPU.cpu0.modifiers]]
at = "0x80076e2"
patch = "r15 0x80076e6"

[[CPU.cpu0.modifiers]]
at = "0x80076e8"
patch = "r15 0x80076ec"

# mqtt_transport_sendPacketBuffer: skip HAL UART transmit and report success
[[CPU.cpu0.modifiers]]
at = "0x8007aaa"
patch = "r15 0x8007aae"

[[CPU.cpu0.modifiers]]
at = "0x8007aae"
patch = "r0 0"

# BSP LED helpers: avoid GPIO writes while preserving higher-level status logic
[[CPU.cpu0.modifiers]]
at = "0x8007d1c"
patch = "r15 0x8007d20"

[[CPU.cpu0.modifiers]]
at = "0x8007d48"
patch = "r15 0x8007d4c"

[[CPU.cpu0.modifiers]]
at = "0x8007d72"
patch = "r15 0x8007d76"

# We fake the output of UART_Receive
[[CPU.cpu0.modifiers]]
at = "0x8007a84"
patch = "r15 0x8007a88"

# ==============================================================================
#                              Device Configuration
# ==============================================================================

[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]

    # --- Peripheral Definitions ---
    # MQTT firmware: Eclipse Paho Embedded C (client subset) on NUCLEO-H753ZI.
    # Transport is USART3 (ST-Link VCP on PD8/PD9) @ 115200-8N1, polled HAL
    # transmit/receive (no UART IRQ used). A host-side bridge forwards the
    # serial byte stream to a Mosquitto broker on TCP:1883. The fuzz target is
    # the Paho MQTT parser (Middlewares/MQTTPacket/) which lives above the
    # emulated UART boundary.
    [Device.usart3]
        ranges = [["0x40004800", "0x40004BFF"]]
        irq = [['1','100']]
        description = "USART3 — Paho MQTT wire-format byte stream to the host bridge."
        read_priority = "classic"

        [[Device.usart3.handlers]]
            model   = "elder"
            enabled = false
            scroll  = "boardrunner/boardrunner_sdk/build/model.so"

        [[Device.usart3.handlers]]
            model   = "classic"
            enabled = true

        [[Device.usart3.handlers]]
            model   = "passthrough"
            enabled = false

        [[Device.usart3.handlers]]
            model   = "twintrace"
            enabled = false

    [Device.remaining_space]
        ranges = [
            ["0x40000000", "0x400047FF"],   # APB1 peripherals before USART3
            ["0x40004C00", "0xE00FFFFF"],   # everything after USART3 up to Cortex-M7 PPB
            ["0xE0000000", "0xEFFFFFFF"]    # Cortex-M7 core / debug (NVIC, SysTick, SCB)
        ]
        irq = [['1','100']]
        description = "Memory regions handled by passthrough. Includes RCC, PWR, GPIOD (USART3 pins), GPIOB (LED1), GPIOE (LED2), and all non-modeled peripherals."

        [[Device.remaining_space.handlers]]
            model = "classic"
            enabled = true

        [[Device.remaining_space.handlers]]
            model = "passthrough"
            enabled = false

        [[Device.remaining_space.handlers]]
            model = "twintrace"
            enabled = false

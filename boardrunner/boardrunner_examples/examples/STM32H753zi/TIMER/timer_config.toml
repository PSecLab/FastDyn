# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]   # required: goes to -machine ... memory-backend=<id>
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"          # file | ram | memfd
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]   # optional banks: go to -global cortexm-soc.ram_backendN / ram_baseaddrN
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32H753x"
# --- Debugging, Control, and Logging ---
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=false
finline='None'

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m7"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf"
binary = "boardrunner/boardrunner_examples/examples/STM32H753zi/TIMER/firmware/TIM_TimeBase.elf"
init_nsvtor = "0x08000000"
map_file = "courbet/rover_v422_map.txt"
twintrace = "None"
hardware_trace = 'hardware_log/io.log'

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]


# --- Peripheral Definitions ---

# TIM3 — General purpose timer in time base mode with interrupt.
# The firmware configures TIM3 with a prescaler for 10 KHz counter clock and
# a period of 10000 (1-second overflow). It starts the timer in interrupt mode
# and tests: (1) that the update interrupt fires the period-elapsed callback,
# and (2) that reading the counter register returns an advancing value.
# TIM3 global interrupt = IRQ 29 on STM32H753.
[Device.tim3]
    ranges = [["0x40000400", "0x400007FF"]]
    irq = [['1','29']]
    description = "TIM3 General Purpose Timer. Time base mode with update interrupt (IRQ 29). Firmware tests callback execution and counter read."
    read_priority = "elder"

    [[Device.tim3.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/model.so"

    [[Device.tim3.handlers]]
        model   = "classic"
        enabled = false

    [[Device.tim3.handlers]]
        model   = "passthrough"
        enabled = false

    [[Device.tim3.handlers]]
        model   = "twintrace"
        enabled = false

# Remaining memory regions passed through to real hardware.
# Includes RCC, PWR, SYSCFG, GPIOB (PB0=LED1, PB14=LED3), GPIOE (PE1=LED2),
# and all other peripherals not modeled.
[Device.remaining_space]
    ranges = [
        ["0x40000000", "0x400003FF"],  # APB1 peripherals before TIM3
        ["0x40000800", "0xDFFFFFFF"],  # APB1/APB2/AHB peripherals after TIM3, GPIO, RCC, PWR
        ["0xE0000000", "0xEFFFFFFF"]   # Cortex-M7 core debug peripherals
    ]
    irq = [['1','100']]
    description = "Memory regions handled by passthrough. Includes GPIO (LEDs), RCC, PWR, SYSCFG, and all non-modeled peripherals."

    [[Device.remaining_space.handlers]]
        model = "classic"
        enabled = false

    [[Device.remaining_space.handlers]]
        model = "passthrough"
        enabled = true

    [[Device.remaining_space.handlers]]
        model = "twintrace"
        enabled = false

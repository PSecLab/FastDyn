# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]
main_ram_size = "512M"
shared_ram_size = "512K"
ram_base_addr = "0x20000000"
shared_ram_base_addr = "0x30000000"
shared_mem_path = "/dev/shm"        # Directory for memory backend files
main_ram_file = "my_m4_ram3"      # Filename for the main RAM backend
shared_ram_file = "my_m4_ram"     # Filename for the shared RAM backend
init_nsvtor = "0x08000000"

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[CPU]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m7"
plugin_library = "build/libfastdyn.so"
# monitor_elf = "../ws/monitor.elf" # The VMM-like monitor that runs with the target
platform = "STM32F7x9"
binary = "/home/hammad/work/side-channel/stm32/STM32CubeF7/Projects/STM32F769I_EVAL/Applications/LwIP/LwIP_HTTP_Server_Raw/SW4STM32/STM32F769I_EVAL/Debug/STM32F769I_EVAL.elf"
# binary = "/scratch/Fastdyn/STM32CubeF7/Projects/STM32F769I_EVAL/Applications/LwIP/LwIP_HTTP_Server_Raw/SW4STM32/STM32F769I_EVAL/Debug/STM32F769I_EVAL.elf"
# --- Debugging, Control, and Logging ---
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""



# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
# Define the global arguments for each type of plugin device model here.

[Device.Models.elder]
    # The libhw backend is a global argument for the elder model.

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]
    # The classic model has no global arguments.

[Device.Models.unhandled]
    # This model explicitly marks memory as unhandled.

#ethernet model
[Device.ethernet]
    irq = "0-100"
    # irq = "61"                                  # ETH Global Interrupt (Vector 77 = IRQ 61)
    ranges = ["0x40028000-0x40029FFF"]          # Covers MAC, MMC, and DMA registers
    description = "STM32F7 Ethernet MAC, MMC, and DMA (Synopsys IP)"

    # This string is passed to your plugin's init function
    scroll_config = """
[ethernet]
internal_model = "stm32_eth"
tap_interface = "tap0"
"""

    [[Device.ethernet.handlers]]
        model   = "elder"
        enabled = true                          # Set to TRUE to use your generated .so
        scroll = "/home/hammad/work/rehosting/FastDyn/boardrunner/boardrunner_sdk/build/model.so"  # UPDATE THIS PATH

    [[Device.ethernet.handlers]]
        model   = "passthrough"
        enabled = true                         # Disable passthrough so your model handles it

[Device.unhandled_space]
    # Existing IRQ config remains the same
    # irq = "0-15:20-25:41:53"
    irq = "0-100"

    # THE UPDATED RANGES:
    ranges = [
        "0x40000000-0x40027FFF",    # Range 2a: From start to just before Ethernet
        "0x4002A000-0xE00FFFFF",    # Range 2b: From just after Ethernet -> To end of Peripherals
        "0xE0000000-0xEFFFFFFF"     # Range 3: System space (Unchanged)
    ]

    description = "Memory regions explicitly not handled by any model (Ethernet hole created)."

    [[Device.unhandled_space.handlers]]
        model = "passthrough"
        enabled = true
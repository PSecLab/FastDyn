[Device.unhandled_space]
    # irq = "0-20:21-25:41:53:56:69"                #means the irq from 0 to 15 and irq from 20 to 25 and 41 are handled
    irq = "0-100"                #means the irq from 0 to 15 and irq from 20 to 25 and 41 are handled
    ranges = ["0x00000000-0x000000FF", "0xE0000000-0xEFFFFFFF", "0x40000000-0xE00FFFFF"]
    description = "Memory regions that are explicitly not handled by any model."

    [[Device.unhandled_space.handlers]]
        model = "passthrough"
        enabled = true


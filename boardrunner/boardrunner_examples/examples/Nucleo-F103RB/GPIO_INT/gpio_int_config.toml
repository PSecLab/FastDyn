# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]   # required: goes to -machine ... memory-backend=<id>
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"          # file | ram | memfd
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]   # optional banks: go to -global cortexm-soc.ram_backendN / ram_baseaddrN
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32F103xx"
# --- Debugging, Control, and Logging ---
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=false
finline='None'

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m3"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf" # The VMM-like monitor that runs with the target
# binary = "/home/hammad/work/rehosting/stm_repo/STM32CubeF1/Projects/STM32F103RB-Nucleo/Examples/GPIO/GPIO_IOToggle/SW4STM32/STM32F103RB_Nucleo/Debug/STM32F103RB_Nucleo.elf"
# binary = "boardrunner/boardrunner_examples/examples/Nucleo-F103RB/GPIO/firmwares/STM32F103RB_Nucleo.elf"
binary = "boardrunner/boardrunner_examples/examples/Nucleo-F103RB/GPIO_INT/firmwares/STM32F103RB_Nucleo.elf"
init_nsvtor = "0x08000000"
map_file = "courbet/rover_v422_map.txt"
twintrace = "None" #options are record, replay or None
hardware_trace = 'hardware_log/io.log'   #useful in cases like replay to generate the replay binary

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
# Define the global arguments for each type of plugin device model here.

[Device.Models.elder]
    # The libhw backend is a global argument for the elder model.

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]
    # The classic model has no global arguments.

[Device.Models.twintrace]
    backend = "stlink"
    # The classic model has no global arguments.

[Device.Models.unhandled]
    # This model explicitly marks memory as unhandled.
# --- Peripheral Definitions ---

# --- Peripheral Definitions ---

# [Device.gpio]
# ONLY handles GPIOC (0x40011000 - 0x400113FF)
# This is sufficient to simulate the Button Press interrupt.
[Device.gpioc]
    ranges = [["0x40011000", "0x400113FF"]]
    irq = [['1','100']]
    description = "GPIOC (Button only) handled by interaction model."
    read_priority = "elder"

    [[Device.gpioc.handlers]]
        model   = "elder"
        enabled = true     # Enable this when you want to inject the button press
        scroll  = "boardrunner/boardrunner_sdk/build/model.so"

    [[Device.gpioc.handlers]]
        model   = "classic"
        enabled = false

    [[Device.gpioc.handlers]]
        model   = "passthrough"
        enabled = false

    [[Device.gpioc.handlers]]
        model   = "twintrace"
        enabled = false

# [Device.remaining_space]
# Handles everything ELSE.
# 1. 0x40000000 - 0x40010FFF: Covers EXTI, AFIO, GPIOA (LED), and GPIOB.
#    (We merged the gap before GPIOC into one large block).
# 2. 0x40011400 - ...: Everything after GPIOC.
[Device.remaining_space]
    ranges = [
        ["0x40000000", "0x40010FFF"], # Start of Peripherals -> End of GPIOB (Includes GPIOA/LED)
        ["0x40011400", "0xE0000000"], # GPIOD -> System Memory
        ["0xE0000000", "0xEFFFFFFF"]  # NVIC / SCB / SysTick
    ]
    irq = [['1','100']]
    description = "Passthrough for LED (GPIOA), EXTI, AFIO, and NVIC."

    [[Device.remaining_space.handlers]]
        model = "classic"
        enabled = false

    [[Device.remaining_space.handlers]]
        model = "passthrough"
        enabled = true

    [[Device.remaining_space.handlers]]
        model = "twintrace"
        enabled = false
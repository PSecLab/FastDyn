# ==============================================================================
# Modbus RTU slave on Nucleo-F103RB — BoardRunner platform config.
# Same shape as the existing Nucleo-F103RB/UART config.
# ==============================================================================

[Memory]

[Memory.main]
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
[Machine]
platform = "STM32F103xx"
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage = true
finline = 'None'

[CPU]
[[CPU.cpu0]]
arch = "arm"
machine = "cortexm"
cpu = "cortex-m3"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../ws/monitor.elf"
binary = "boardrunner/boardrunner_examples/examples/Nucleo-F103RB/Modbus/firmware/STM32F103RB_Modbus.elf"
init_nsvtor = "0x08000000"
twintrace = "None"
hardware_trace = 'hardware_log/io.log'

logger_content = """
# level = DEBUG
# output = stderr
"""

[[CPU.cpu0.virtuals]] # main loop anchor before modbus_app_poll
at = "0x8000268"
instruction = "fuzz_snap_point"
args = [""]

[[CPU.cpu0.virtuals]]
at = "0x8000ef4"
instruction = "fuzz_sync_point"
args = [""]

[[CPU.cpu0.modifiers]] # skip LED_Init; GPIOA pin setup is irrelevant to Modbus
at = "0x8000260"
patch = "r15 0x8000264"

[[CPU.cpu0.modifiers]] # skip heartbeat HAL_GetTick/GPIO toggle after eMBPoll
at = "0x800066a"
patch = "r15 0x800067a"

[[CPU.cpu0.modifiers]] # skip USART2 TX pin HAL_GPIO_Init
at = "0x8000714"
patch = "r15 0x8000718"

[[CPU.cpu0.modifiers]] # skip USART2 RX pin HAL_GPIO_Init
at = "0x8000724"
patch = "r15 0x8000728"

# ==============================================================================
[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]

    [Device.usart2]
        ranges = [["0x40004400", "0x400047FF"]]
        irq = [['1','100']]
        description = "USART2 — FreeMODBUS RTU byte stream"
        read_priority = "elder"

        [[Device.usart2.handlers]]
            model   = "elder"
            enabled = true
            scroll  = "boardrunner/boardrunner_sdk/build/model.so"

        [[Device.usart2.handlers]]
            model   = "classic"
            enabled = false

        [[Device.usart2.handlers]]
            model   = "passthrough"
            enabled = false

        [[Device.usart2.handlers]]
            model   = "twintrace"
            enabled = false


    [Device.remaining_space]
        ranges = [
            ["0x40000000", "0x400043FF"],
            ["0x40004800", "0xDFFFFFFF"],
            ["0xE0000000", "0xEFFFFFFF"]
        ]
        irq = [['1','100']]
        description = "Memory regions handled by passthrough"

        [[Device.remaining_space.handlers]]
            model   = "classic"
            enabled = false

        [[Device.remaining_space.handlers]]
            model   = "passthrough"
            enabled = true

        [[Device.remaining_space.handlers]]
            model   = "twintrace"
            enabled = false

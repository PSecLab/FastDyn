# ---------------------------------------------
# OpenOCD config for STM32F746ZG (Cortex-M7)
# ---------------------------------------------

# --- Interface section ------------------------
# Use the ST-LINK interface (change if using J-Link or other)
source [find interface/stlink.cfg]

# For J-Link use instead:
# source [find interface/jlink.cfg]

transport select hla_swd

# --- Target section ---------------------------
source [find target/stm32f7x.cfg]

# If your board isn’t recognized automatically, set explicitly:
# set CHIPNAME stm32f746zg
# set CPUTAPID 0x5ba00477

# --- Adapter speed ----------------------------
# Safe starting speed; increase to 4000 or 8000 if stable
adapter speed 4000

# --- Reset configuration ----------------------
reset_config srst_only srst_nogate connect_assert_srst

# --- Flash programming defaults ---------------
# (These lines let OpenOCD program internal flash correctly)
init
reset init

# Optionally verify that core is running and flash is writable
# flash info 0
# flash probe 0

# Halt processor after reset
reset halt

# --- GDB server setup (optional) --------------
# GDB connects to :3333 by default
# telnet :4444 for OpenOCD commands

# Done
# echo "STM32F756ZG OpenOCD config loaded."

# program /home/michael/STM32CubeIDE/workspace_1.19.0/nucleof756zg_gpio/Debug/nucleof756zg_gpio.elf verify reset exit
program /home/michael/STM32CubeIDE/workspace_1.19.0/nucleof756zg_server/Debug/nucleof756zg_server.elf verify reset exit

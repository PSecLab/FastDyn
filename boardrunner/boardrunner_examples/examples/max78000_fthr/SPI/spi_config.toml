# ==============================================================================
# Machine (machine-wide + QEMU target options)
# ==============================================================================
[Machine]
platform = "Max78000"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = false
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage     = true
finline      = ""

# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  # ---------------------------------------------------------------------------
  # Main memory (required)
  # ---------------------------------------------------------------------------
  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram3"

  share    = true
  prealloc = false


  # ---------------------------------------------------------------------------
  # Extra memory banks (optional)
  # ---------------------------------------------------------------------------
  [[Memory.ram1]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false

# ==============================================================================
# CPUs
# ==============================================================================
[CPU]

  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  binary = "boardrunner/boardrunner_examples/examples/max78000_fthr/SPI/firmware/SPI.elf"
  init_nsvtor = "0x10000000"

  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  twintrace       = "None"
  hardware_trace  = "hardware_log/io.log"

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = DEBUG
  # output = stderr
  """

# ==============================================================================
# Device model defaults (global settings per model type)
# ==============================================================================
[Device.Models]

  [Device.Models.elder]

  [Device.Models.passthrough]
  backend = "openocd"

  [Device.Models.classic]

  [Device.Models.twintrace]
  backend = "openocd"

  [Device.Models.unhandled]

# ==============================================================================
# Devices (MAX78000)
# ==============================================================================

# --- SPI0 (MXC_SPI0) — master controller model ---
# Loopback test: MOSI (P0.5) wired to MISO (P0.6). No external slave device.
# The slave model implements wire loopback (returns the byte it receives).
[Device.spi0]
    # SPI0 base: 0x400BE000, size: 0x1000 (from SVD)
    ranges = [["0x400BE000", "0x400BEFFF"]]
    # SPI0_IRQn = 56 (from SVD)
    irq = [['1','56']]
    description = "SPI0 peripheral (QSPI/High-Speed SPI). Master polling loopback: transmits 16 bytes of 0xA5, receives them back via MOSI-to-MISO wire."
    read_priority = "elder"

    [[Device.spi0.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/model.so"

        [[Device.spi0.slaves]]
            model         = ["elder"]
            device        = "loopback"
            cs_id         = 0
            device_scroll = "boardrunner/boardrunner_sdk/build/slave.so"

    [[Device.spi0.handlers]]
        model   = "classic"
        enabled = false

    [[Device.spi0.handlers]]
        model   = "passthrough"
        enabled = false

    [[Device.spi0.handlers]]
        model   = "twintrace"
        enabled = false

# --- Remaining space: everything not covered by SPI0 ---
# Includes GPIO0 (SPI pins), GPIO2 (LEDs), GCR, UART, TMR, etc.
[Device.remaining_space]
    ranges = [
        ["0x40000000", "0x400BDFFF"],   # peripherals before SPI0
        ["0x400BF000", "0xDFFFFFFF"],   # after SPI0 to system boundary
        ["0xE0000000", "0xEFFFFFFF"]    # system space (NVIC, SysTick, etc.)
    ]
    irq = [['1','150']]
    description = "Memory regions handled by passthrough. Includes GPIO0 (SPI AF pins), GPIO2 (LEDs), GCR, UART, TMR, and all other non-modeled peripherals."

    [[Device.remaining_space.handlers]]
        model = "classic"
        enabled = false

    [[Device.remaining_space.handlers]]
        model = "passthrough"
        enabled = true

    [[Device.remaining_space.handlers]]
        model = "twintrace"
        enabled = false

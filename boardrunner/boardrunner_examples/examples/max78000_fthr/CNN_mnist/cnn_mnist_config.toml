# ==============================================================================
# CNN_mnist — Compositional rehosting of MAX78000 CNN-based firmware.
#
# UART0 is served by the learned VIO model (elder backend, model.so).
# Everything else, including the CNN MMIO window (0x5000_0000+),
# the GCR CNN power-domain bits, GPIO2 LEDs, TMR, and the Cortex-M4
# system space, is forwarded to the real MAX78000FTHR via passthrough.
#
# This configuration is the Case Study 2 baseline: the CNN accelerator
# runs on silicon while the surrounding peripherals are emulated.
# ==============================================================================

[Machine]
platform = "Max78000"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = false
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage     = true
finline      = ""

# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram3"

  share    = true
  prealloc = false

  [[Memory.ram1]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false

# ==============================================================================
# CPU
# ==============================================================================
[CPU]

  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  # mnist ELF (built from /scratch/Fastdyn/saved_maxim_examples/Examples/MAX78000/CNN/mnist/)
  binary = "boardrunner/boardrunner_examples/examples/max78000_fthr/CNN_mnist/firmware/CNN_mnist.elf"

  init_nsvtor = "0x10000000"

  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  twintrace       = "None"
  hardware_trace  = "hardware_log/io.log"

  logger_content = """
  # --- Plugin Logger Configuration ---
  """

# ==============================================================================
# Device model defaults
# ==============================================================================
[Device.Models]

  [Device.Models.elder]

  [Device.Models.passthrough]
  backend = "openocd"

  [Device.Models.classic]

  [Device.Models.twintrace]
  backend = "openocd"

  [Device.Models.unhandled]

# ==============================================================================
# Devices
# ==============================================================================

# UART0 — Console UART. mnist uses printf to report classification results.
# Served by the VIO elder model reused from the UART example.
[Device.uart]
  ranges        = [["0x40042000", "0x40042FFF"]]
  irq           = [['1','150']]
  description   = "UART0: mnist printf output. Elder-backed VIO model."
  read_priority = "elder"

  [[Device.uart.handlers]]
  model   = "elder"
  enabled = true
  scroll  = "boardrunner/boardrunner_sdk/build/model.so"

  [[Device.uart.handlers]]
  model   = "classic"
  enabled = false

  [[Device.uart.handlers]]
  model   = "passthrough"
  enabled = false

  [[Device.uart.handlers]]
  model   = "twintrace"
  enabled = false

# Everything else goes to passthrough. Explicitly covers:
#   GCR        (0x40000000) — includes CNN power-domain gating (CNNx16_*_pwr_en, etc.)
#   GPIO2      (0x40080400) — LED indicators for PASS / FAIL
#   TMR0-3     (0x40010000) — MXC_Delay + cnn_time stopwatch
#   CNN range  (0x50000000) — quadrants 0-3: control / weight / data / bias memory
#   Cortex-M4  (0xE0000000) — NVIC, SysTick, SCB
[Device.passthrough_space]
  irq = [['1','150']]
  ranges = [
    ["0x40000000", "0x40041FFF"],   # peripherals before UART0 (includes GCR, GPIO0-1, TMR, I2C)
    ["0x40043000", "0xE00FFFFF"],   # everything after UART0 (includes GPIO2, CNN @ 0x50000000)
    ["0xE0000000", "0xEFFFFFFF"]    # Cortex-M4 system space
  ]
  description = "Passthrough window: GCR, GPIO, TMR, CNN (0x5000_0000+), and system space."

  [[Device.passthrough_space.handlers]]
  model   = "classic"
  enabled = false

  [[Device.passthrough_space.handlers]]
  model   = "passthrough"
  enabled = true

  [[Device.passthrough_space.handlers]]
  model   = "twintrace"
  enabled = false

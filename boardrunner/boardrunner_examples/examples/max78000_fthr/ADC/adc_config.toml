# ==============================================================================
# Machine
# ==============================================================================
[Machine]
platform = "Max78000"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = false
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage     = true
finline      = ""

# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram3"

  share    = true
  prealloc = false

  [[Memory.ram1]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false

# ==============================================================================
# CPUs
# ==============================================================================
[CPU]

  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  binary      = "boardrunner/boardrunner_examples/examples/max78000_fthr/ADC/firmware/ADC.elf"

  init_nsvtor = "0x10000000"

  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  twintrace       = "None"
  hardware_trace  = "hardware_log/io.log"

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = DEBUG
  # output = stderr
  """

# ==============================================================================
# Device model defaults
# ==============================================================================
[Device.Models]

  [Device.Models.elder]

  [Device.Models.passthrough]
  backend = "openocd"

  [Device.Models.classic]

  [Device.Models.twintrace]
  backend = "openocd"

  [Device.Models.unhandled]

# ==============================================================================
# Devices (MAX78000)
# ==============================================================================

# ADC — Single conversion test on channel 3.
# Firmware enables ADC reference + power, polls REF_READY_IF, sets channel
# select bits, sets START, polls STATUS.ACTIVE for completion, reads DATA.
# No IRQ used (polling-based). NVIC IRQn 36 reserved but unused.
# Registers: CTRL, STATUS, INTR, DATA, plus monitor / limit registers.
[Device.adc]
  ranges       = [["0x40034000", "0x40034FFF"]]
  irq          = [['1', '150']]
  description  = "ADC: single-conversion polling test on channel 3. IRQ 36 (unused, polling)."
  read_priority = "elder"

  [[Device.adc.handlers]]
  model   = "elder"
  enabled = true
  scroll  = "boardrunner/boardrunner_sdk/build/model.so"

  [[Device.adc.handlers]]
  model   = "classic"
  enabled = false

  [[Device.adc.handlers]]
  model   = "passthrough"
  enabled = false

  [[Device.adc.handlers]]
  model   = "twintrace"
  enabled = false

# Remaining memory regions passed through to real hardware.
# Includes:
#   GCR     (0x40000000) — clock/reset control (touched during MXC_ADC_Init)
#   GPIO0-2 — LED on GPIO2
#   TMR0-3, DMA, I2C, SPI, UART — not used by this firmware
#   System (E0000000+) — NVIC, SysTick, SCB
[Device.passthrough_space]
  irq = [['1','150']]
  ranges = [
    ["0x40000000", "0x40033FFF"],   # all peripherals before ADC
    ["0x40035000", "0xE00FFFFF"],   # all peripherals after ADC (includes GPIO2, UART, etc.)
    ["0xE0000000", "0xEFFFFFFF"]    # Cortex-M4 system space (NVIC, SysTick, SCB)
  ]

  description = "Memory regions handled by passthrough. Includes GCR, GPIO (LEDs), UART (printf), and all non-modeled peripherals."

  [[Device.passthrough_space.handlers]]
  model   = "classic"
  enabled = false

  [[Device.passthrough_space.handlers]]
  model   = "passthrough"
  enabled = true

  [[Device.passthrough_space.handlers]]
  model   = "twintrace"
  enabled = false

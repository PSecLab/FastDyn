# ==============================================================================
# Machine (machine-wide + QEMU target options)
# ==============================================================================
[Machine]
platform = "Max78000"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = false
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage     = true
finline      = ""

# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  # ---------------------------------------------------------------------------
  # Main memory (required)
  # ---------------------------------------------------------------------------
  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"                 # file | ram | memfd
  memory_file = "/dev/shm/my_m4_ram3"  # main RAM backend file

  share    = true
  prealloc = false


  # ---------------------------------------------------------------------------
  # Extra memory banks (optional)
  # ---------------------------------------------------------------------------
  [[Memory.ram1]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false

# ==============================================================================
# CPUs
# ==============================================================================
[CPU]

  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  binary      = "boardrunner/boardrunner_examples/examples/max78000_fthr/GPIO_INT/firmware/GPIO_INT.elf"

  init_nsvtor = "0x10000000"

  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  twintrace       = "None"                 # record | replay | None
  hardware_trace  = "hardware_log/io.log"  # useful for replay workflows

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = DEBUG
  # output = stderr
  """

# ==============================================================================
# Device model defaults (global settings per model type)
# ==============================================================================
[Device.Models]

  [Device.Models.elder]
  # (empty by default)

  [Device.Models.passthrough]
  backend = "openocd"

  [Device.Models.classic]
  # (empty by default)

  [Device.Models.twintrace]
  backend = "openocd"

  [Device.Models.unhandled]
  # (empty by default)

# ==============================================================================
# Devices (MAX78000)
# ==============================================================================

# --- Peripheral Definitions ---

# GPIO0 — Input pin with interrupt for button press detection.
# The firmware configures P0.2 (SW1) as input with pull-up and falling-edge
# interrupt. When the button is pressed, GPIO0 IRQ 24 fires, the ISR clears
# INTFL and toggles the LED on GPIO2. This is the primary model target.
# Key registers: EN0, INEN, INTEN, INTPOL, INTMODE, INTFL, INTFL_CLR, PADCTRL0/1
[Device.gpio0]
  ranges       = [["0x40008000", "0x400080FF"]]
  irq = [['1','150']]
  description  = "GPIO Port 0: input pin P0.2 (SW1 button). Falling-edge interrupt (IRQ 24) triggers callback that toggles LED on GPIO2."
  read_priority = "elder"

  [[Device.gpio0.handlers]]
  model   = "elder"
  enabled = true
  scroll  = "boardrunner/boardrunner_sdk/build/model.so"

  [[Device.gpio0.handlers]]
  model   = "classic"
  enabled = false

  [[Device.gpio0.handlers]]
  model   = "passthrough"
  enabled = false

  [[Device.gpio0.handlers]]
  model   = "twintrace"
  enabled = false

# Remaining memory regions passed through to real hardware.
# GPIO2 (P2.0 LED) is passthrough so that MXC_GPIO_OutToggle in the ISR
# writes to real hardware and the physical LED toggles on the board.
# Includes:
#   GCR     (0x40000000) — clock/reset control
#   GPIO1   (0x40009000) — not used by this firmware
#   GPIO2   (0x40080400) — LED output, passthrough to real hardware
#   TMR0-3  (0x40010000-0x40013FFF) — not used (no MXC_Delay)
#   I2C0-2  (0x4001D000-0x4001FFFF) — not used
#   UART0-2 (0x40042000-0x40044FFF) — printf console output
#   SPI1    (0x40046000) — not used
[Device.passthrough_space]
  irq = [['1','150']]

  ranges = [
    ["0x40000000", "0x40007FFF"],   # all peripherals before GPIO0
    ["0x40008100", "0xE00FFFFF"],   # everything after GPIO0 (including GPIO2, UART, etc.)
    ["0xE0000000", "0xEFFFFFFF"]    # Cortex-M4 system space (NVIC, SysTick, SCB)
  ]

  description = "Memory regions handled by passthrough. Includes GCR, UART (printf), and all non-modeled peripherals."

  [[Device.passthrough_space.handlers]]
  model   = "classic"
  enabled = false

  [[Device.passthrough_space.handlers]]
  model   = "passthrough"
  enabled = true

  [[Device.passthrough_space.handlers]]
  model   = "twintrace"
  enabled = false

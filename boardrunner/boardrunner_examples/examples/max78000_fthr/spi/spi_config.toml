# ==============================================================================
# Machine (machine-wide + QEMU target options)
# ==============================================================================
[Machine]
platform = "Max78000"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = false
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage     = true
bbl_coverage = true
finline      = ""

# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  # ---------------------------------------------------------------------------
  # Main memory (required)
  # ---------------------------------------------------------------------------
  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"                 # file | ram | memfd
  memory_file = "/dev/shm/my_m4_ram3"  # main RAM backend file

  share    = true
  prealloc = false


  # ---------------------------------------------------------------------------
  # Extra memory banks (optional)  (your old "shared RAM")
  # ---------------------------------------------------------------------------
  [[Memory.ram1]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false

# ==============================================================================
# CPUs
# ==============================================================================
[CPU]

  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  binary = "boardrunner/boardrunner_examples/examples/max78000_fthr/spi/firmware/SPI.elf"

  init_nsvtor = "0x10000000"

  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  twintrace       = "None"                 # record | replay | None
  hardware_trace  = "hardware_log/io.log"  # useful for replay workflows

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = DEBUG
  # output = stderr
  """

# ==============================================================================
# Device model defaults (global settings per model type)
# ==============================================================================
[Device.Models]

  [Device.Models.elder]
  # (empty by default)

  [Device.Models.passthrough]
  backend = "openocd"

  [Device.Models.classic]
  # (empty by default)

  [Device.Models.twintrace]
  backend = "openocd"

  [Device.Models.unhandled]
  # (empty by default)

# ==============================================================================
# Devices (MAX78000)
# ==============================================================================

# --- Peripheral Definitions ---

[Device.spi]
    # MAX78000 SPI0 (MXC_SPI0) Base Address: 0x400BE000
    ranges = [["0x400BE000", "0x400BE3FF"]]
    # SPI0_IRQn is 72 on MAX78000
    irq = [['1','72']]
    description = "SPI0 Peripheral (QSPI/High-Speed SPI) for BME280 Sensor."
    read_priority = "elder"

    [[Device.spi.handlers]]
        model   = "elder"
        enabled = false
        scroll = "boardrunner/boardrunner_sdk/build/model.so"

    [[Device.spi.handlers]]
        model   = "classic"
        enabled = false

    [[Device.spi.handlers]]
        model   = "passthrough"
        enabled = true

    [[Device.spi.handlers]]
        model   = "twintrace"
        enabled = false

[Device.remaining_space]
    # Covers all space *except* the SPI0 range defined above.
    # 1. Start of Peripherals -> Start of SPI0 (Includes old GPIO space)
    # 2. End of SPI0 -> System/PPB Boundary
    # 3. System/PPB Space
    ranges = [["0x40000000", "0x400BDFFF"], ["0x400BE400", "0xE0000000"], ["0xE0000000", "0xEFFFFFFF"]]
    irq = [['1','100']]
    description = "Memory regions that will handled by passthrough and are not of interest for the modeling."

    [[Device.remaining_space.handlers]]
        model = "classic"
        enabled = false

    [[Device.remaining_space.handlers]]
        model = "passthrough"
        enabled = true

    [[Device.remaining_space.handlers]]
        model = "twintrace"
        enabled = false
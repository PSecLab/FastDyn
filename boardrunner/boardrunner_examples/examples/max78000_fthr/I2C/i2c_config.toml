# ==============================================================================
# Machine (machine-wide + QEMU target options)
# ==============================================================================
[Machine]
platform = "Max78000"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = false
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage     = true
finline      = ""

# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  # ---------------------------------------------------------------------------
  # Main memory (required)
  # ---------------------------------------------------------------------------
  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram3"

  share    = true
  prealloc = false

  # ---------------------------------------------------------------------------
  # Extra memory banks (optional)
  # ---------------------------------------------------------------------------
  [[Memory.ram1]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false

# ==============================================================================
# CPUs
# ==============================================================================
[CPU]

  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  binary      = "/scratch/Fastdyn/FastDyn/boardrunner/boardrunner_examples/examples/max78000_fthr/I2C/firmware/I2C_Sensor.elf"

  init_nsvtor = "0x10000000"

  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  twintrace       = "None"
  hardware_trace  = "hardware_log/io.log"

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = DEBUG
  # output = stderr
  """

# ==============================================================================
# Device model defaults (global settings per model type)
# ==============================================================================
[Device.Models]

  [Device.Models.elder]

  [Device.Models.passthrough]
  backend = "openocd"

  [Device.Models.classic]

  [Device.Models.twintrace]
  backend = "openocd"

  [Device.Models.unhandled]

# ==============================================================================
# Devices (MAX78000)
# ==============================================================================

# --- Peripheral Definitions ---

# I2C1 — master controller model.
# SCL=P0.16, SDA=P0.17 (AF1). Polling mode with fixed delays, no DMA, no
# interrupts. Slave device (BME280) at 7-bit address 0x76.
# No GPIO CS line — I2C uses address-based selection.
[Device.i2c1]
  ranges       = [["0x4001E000", "0x4001EFFF"]]
  irq          = [['1', '36']]
  description  = "I2C1 master controller. Firmware uses direct register writes (FIFO, MSTCTRL) with fixed delays to perform write-byte and read-byte transactions to a BME280 at 0x76. IRQ 36 unused (polling mode)."
  read_priority = "elder"

  [[Device.i2c1.handlers]]
  model   = "elder"
  enabled = true
  scroll  = "boardrunner/boardrunner_sdk/build/model.so"

  [[Device.i2c1.slaves]]
  model   = ["elder"]
  device  = "bme280"
  address = "0x76"
  device_scroll = "boardrunner/boardrunner_sdk/build/slave.so"

  [[Device.i2c1.handlers]]
  model   = "classic"
  enabled = false

  [[Device.i2c1.handlers]]
  model   = "passthrough"
  enabled = false

  [[Device.i2c1.handlers]]
  model   = "twintrace"
  enabled = false

# Remaining memory regions passed through to real hardware.
# Includes:
#   GCR     (0x40000000) — clock/reset control
#   GPIO0   (0x40008000) — I2C1 pin muxing (P0.16/P0.17)
#   GPIO1   (0x40009000) — not used
#   GPIO2   (0x40080400) — LED pins
#   TMR0-3  (0x40010000-0x40013FFF) — MXC_Delay uses a timer
#   I2C0    (0x4001D000) — not used
#   I2C2    (0x4001F000) — not used
#   UART0-2 (0x40042000-0x40044FFF) — printf console output
#   SPI1    (0x40046000) — not used
[Device.passthrough_space]
  irq = [
    [0, 35],
    [37, 69]
  ]

  ranges = [
    ["0x40000000", "0x4001DFFF"],   # all peripherals before I2C1
    ["0x4001F000", "0xE00FFFFF"],   # all peripherals after I2C1 (includes GPIO2, etc.)
    ["0xE0000000", "0xEFFFFFFF"]    # Cortex-M4 system space (NVIC, SysTick, SCB)
  ]

  description = "Memory regions handled by passthrough. Includes GCR, GPIO (pins/LEDs), UART (printf), TMR (delay), and all non-modeled peripherals."

  [[Device.passthrough_space.handlers]]
  model   = "classic"
  enabled = false

  [[Device.passthrough_space.handlers]]
  model   = "passthrough"
  enabled = true

  [[Device.passthrough_space.handlers]]
  model   = "twintrace"
  enabled = false

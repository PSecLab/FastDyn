# ==============================================================================
# Machine (machine-wide + QEMU target options)
# ==============================================================================
[Machine]
platform = "Max78000"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = false
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage     = true
finline      = ""

# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  # ---------------------------------------------------------------------------
  # Main memory (required)
  # ---------------------------------------------------------------------------
  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"                 # file | ram | memfd
  memory_file = "/dev/shm/my_m4_ram3"  # main RAM backend file

  share    = true
  prealloc = false


  # ---------------------------------------------------------------------------
  # Extra memory banks (optional)  (your old "shared RAM")
  # ---------------------------------------------------------------------------
  [[Memory.ram1]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false

# ==============================================================================
# CPUs
# ==============================================================================
[CPU]

  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  binary      = "boardrunner/boardrunner_examples/examples/max78000_fthr/GPIO/firmware/GPIO.elf"

  init_nsvtor = "0x10000000"

  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  twintrace       = "None"                 # record | replay | None
  hardware_trace  = "hardware_log/io.log"  # useful for replay workflows

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = DEBUG
  # output = stderr
  """

# ==============================================================================
# Device model defaults (global settings per model type)
# ==============================================================================
[Device.Models]

  [Device.Models.elder]
  # (empty by default)

  [Device.Models.passthrough]
  backend = "openocd"

  [Device.Models.classic]
  # (empty by default)

  [Device.Models.twintrace]
  backend = "openocd"

  [Device.Models.unhandled]
  # (empty by default)

# ==============================================================================
# Devices (MAX78000)
# ==============================================================================

# --- Peripheral Definitions ---

# GPIO2 — Output pin control for LED blink.
# The firmware configures P2.0 as output and toggles it with OUT_SET / OUT_CLR
# in a 500 ms loop. GPIO2 interrupt (IRQ 26) is not used by this firmware.
[Device.gpio2]
  ranges       = [["0x40080400", "0x400805FF"]]
  irq          = [['1', '26']]
  description  = "GPIO Port 2: output pin P2.0 (red LED). Firmware uses OUT_SET/OUT_CLR to toggle. IRQ 26 unused in this example."
  read_priority = "elder"

  [[Device.gpio2.handlers]]
  model   = "elder"
  enabled = true
  scroll  = "boardrunner/boardrunner_sdk/build/model.so"

  [[Device.gpio2.handlers]]
  model   = "classic"
  enabled = false

  [[Device.gpio2.handlers]]
  model   = "passthrough"
  enabled = false

  [[Device.gpio2.handlers]]
  model   = "twintrace"
  enabled = false

# Remaining memory regions passed through to real hardware.
# Includes:
#   GCR     (0x40000000) — clock/reset control
#   GPIO0   (0x40008000) — not used by this firmware
#   GPIO1   (0x40009000) — not used by this firmware
#   TMR0-3  (0x40010000-0x40013FFF) — MXC_Delay uses a timer
#   I2C0-2  (0x4001D000-0x4001FFFF) — not used
#   UART0-2 (0x40042000-0x40044FFF) — printf console output
#   SPI1    (0x40046000) — not used
[Device.passthrough_space]
  irq = [
    [0, 20],
    [21, 25],
    [41, 41],
    [53, 53],
    [69, 69]
  ]

  ranges = [
    ["0x40000000", "0x400803FF"],   # all peripherals before GPIO2
    ["0x40080600", "0xE00FFFFF"],   # all peripherals after GPIO2
    ["0xE0000000", "0xEFFFFFFF"]    # Cortex-M4 system space (NVIC, SysTick, SCB)
  ]

  description = "Memory regions handled by passthrough. Includes GCR, UART (printf), TMR (delay), and all non-modeled peripherals."

  [[Device.passthrough_space.handlers]]
  model   = "classic"
  enabled = false

  [[Device.passthrough_space.handlers]]
  model   = "passthrough"
  enabled = true

  [[Device.passthrough_space.handlers]]
  model   = "twintrace"
  enabled = false

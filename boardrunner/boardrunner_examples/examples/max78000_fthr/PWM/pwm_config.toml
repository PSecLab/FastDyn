# ==============================================================================
# Machine
# ==============================================================================
[Machine]
platform = "Max78000"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = false
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage     = true
finline      = ""

# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram3"

  share    = true
  prealloc = false

  [[Memory.ram1]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false

# ==============================================================================
# CPUs
# ==============================================================================
[CPU]

  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m4"

  binary      = "boardrunner/boardrunner_examples/examples/max78000_fthr/PWM/firmware/PWM.elf"

  init_nsvtor = "0x10000000"

  plugin_library = "build/libfastdyn.so"
  monitor_elf    = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "in_asm,op"

  twintrace       = "None"
  hardware_trace  = "hardware_log/io.log"

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = DEBUG
  # output = stderr
  """

# ==============================================================================
# Device model defaults
# ==============================================================================
[Device.Models]

  [Device.Models.elder]

  [Device.Models.passthrough]
  backend = "openocd"

  [Device.Models.classic]

  [Device.Models.twintrace]
  backend = "openocd"

  [Device.Models.unhandled]

# ==============================================================================
# Devices (MAX78000)
# ==============================================================================

# TMR2 — 32-bit timer in PWM mode (1 kHz, 50% duty, IBRO clock, prescaler 4).
# Firmware writes CTRL0/CTRL1/CMP/PWM during init, starts the timer, and then
# idles. PWM output runs autonomously in hardware; no IRQ, no runtime polling.
# Registers: CNT, CMP, PWM, INTFL, CTRL0, NOLCMP, CTRL1, WKFL.
[Device.tmr2]
  ranges       = [["0x40012000", "0x40012FFF"]]
  irq          = [['1', '150']]
  description  = "Timer 2: 32-bit PWM mode, 1 kHz / 50% duty. IRQ 7 (unused for PWM)."
  read_priority = "elder"

  [[Device.tmr2.handlers]]
  model   = "elder"
  enabled = true
  scroll  = "boardrunner/boardrunner_sdk/build/model.so"

  [[Device.tmr2.handlers]]
  model   = "classic"
  enabled = false

  [[Device.tmr2.handlers]]
  model   = "passthrough"
  enabled = false

  [[Device.tmr2.handlers]]
  model   = "twintrace"
  enabled = false

# Remaining memory regions passed through to real hardware.
# Includes:
#   GCR     (0x40000000) — clock/reset control (touched during MXC_TMR_Init)
#   GPIO0-2 — pin alt function setup for TMR2 PWM output, plus LED on GPIO2
#   TMR0-1, TMR3 — not used by this firmware
#   UART0-2 — printf console output
[Device.passthrough_space]
  irq = [['1','150']]
  ranges = [
    ["0x40000000", "0x40011FFF"],   # all peripherals before TMR2
    ["0x40013000", "0xE00FFFFF"],   # all peripherals after TMR2 (includes GPIO2, UART, etc.)
    ["0xE0000000", "0xEFFFFFFF"]    # Cortex-M4 system space (NVIC, SysTick, SCB)
  ]

  description = "Memory regions handled by passthrough. Includes GCR, GPIO (alt-function pin setup + LEDs), UART (printf), and all non-modeled peripherals."

  [[Device.passthrough_space.handlers]]
  model   = "classic"
  enabled = false

  [[Device.passthrough_space.handlers]]
  model   = "passthrough"
  enabled = true

  [[Device.passthrough_space.handlers]]
  model   = "twintrace"
  enabled = false

# ==============================================================================
#   Microbenchmark: modifier hot-path overhead (wall-clock, CLOCK_MONOTONIC)
#
#   Firmware (microbench.c, BENCH_SLICE):
#       bench_start();                       <- benchmark_start virtual: sample t0
#       for (i=0; i<N_OUTER; i++)
#         for (j=0; j<N_INNER; j++)
#           slice_probe();                   <- modifier fires here per call
#       bench_done();                        <- benchmark_end virtual: sample t1, print delta
#       while (1);                           <- kill QEMU: Ctrl-C or `timeout 5s ...`
#
#   Symbol PCs (from `arm-none-eabi-nm build/microbench_slice.axf`):
#       slice_probe = 0x080001ac
#       bench_start = 0x080001ba
#       bench_done  = 0x080001c8
#
#   Total modifier hits per run = N_OUTER * N_INNER (default 1 * 100 = 100).
#   For stable numbers rebuild firmware with a large N_INNER, e.g.
#       cd .../firmware && make clean && make N_INNER=1000000
#   so QEMU startup/teardown is negligible compared to modifier work.
#
#   Output (stdout, printed after t1 is sampled - no in-region I/O):
#       [BENCH][slice_modifier] elapsed_ns=<int64> elapsed_us=<double>
# ==============================================================================

# ------------------------------ Memory ---------------------------------------
[Memory]

[Memory.main]
id           = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "../qemu/ws/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]
id           = "ram1"
index        = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "../qemu/ws/my_m4_ram"
share        = true
prealloc     = false

# ------------------------------ Machine --------------------------------------
[Machine]
platform            = "STM32F429"
qemu_path           = "../qemu/build/qemu-system-arm"
enable_gdb          = false          # skip GDB stub for lower startup overhead
stop_on_start       = false
launch_gdb          = false
monitor_port        = 5555
qmp_socket          = "/tmp/qmp-microbench.sock"
log_file            = "qemu.log"
log_options         = "none"         # no -d in_asm/op - plugin hot path only
semihosting         = true
semihosting_config  = "enable=on,target=native"
coverage            = false          # coverage logger adds per-TB overhead
finline             = "None"
print_command       = true

# ------------------------------ CPU ------------------------------------------
[CPU]
[[CPU.cpu0]]
arch                 = "arm"
machine              = "cortexm"
cpu                  = "cortex-m4"
plugin_library       = "build/libfastdyn.so"
monitor_elf          = "../qemu/ws/monitor.elf"
binary               = "boardrunner/boardrunner_examples/microbenchmarks/firmware_slicing/firmware/build/microbench_slice.axf"
init_nsvtor          = "0x08000000"
twintrace            = "None"
hardware_trace       = "hardware_log/io.log"
introspect           = false
existing_config_path = false

# --- Timing markers ---
# benchmark_start: no I/O, just captures CLOCK_MONOTONIC (t0).
# benchmark_end:   captures t1, then prints "[BENCH][<tag>] elapsed_ns=..."
[[CPU.cpu0.virtuals]]
at          = "0x080001ba"           # bench_start
instruction = "benchmark_start"
args        = [""]

[[CPU.cpu0.virtuals]]
at          = "0x080001c8"           # bench_done
instruction = "benchmark_end"
args        = ["slice_modifier"]

# --- The modifier under test ---
# Cheapest modifier form: immediate -> register (inline TCG, no callback).
# Fires once at slice_probe entry - N_OUTER * N_INNER hits per run.
[[CPU.cpu0.modifiers]]
at    = "0x080001ac"                 # slice_probe entry
patch = "r15 r14"

# ------------------------------ Devices --------------------------------------
# Firmware touches no MMIO; keep handlers off so unmodeled ranges cost nothing.
[Device.Models.classic]
[Device.Models.unhandled]

[Device.remaining_space]
ranges      = [["0x40000000", "0x400107FF"], ["0x40010C00", "0x40010FFF"], ["0x40011400", "0xE0000000"], ["0xE0000000", "0xEFFFFFFF"]]
irq         = [["1", "100"]]
description = "Unmodeled MMIO - no handlers active for this microbench."

  [[Device.remaining_space.handlers]]
  model   = "classic"
  enabled = false

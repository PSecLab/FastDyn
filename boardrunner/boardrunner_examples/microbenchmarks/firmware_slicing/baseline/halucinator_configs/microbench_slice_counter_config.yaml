# Slicing microbenchmark intercepts (Fig 7 left bar).
#
# Payload under measurement:
#   slice_probe() is called N_INNER × N_OUTER = 100 × 1 = 100 times.
#   Every call fires this intercept.  On baseline HALucinator that means
#   100 Python callback dispatches; on Halucinator_Turbo the same intercept
#   becomes an in-line FastDyn modifier (`r15 r14`) plus a virtual callback
#   that dispatches to the same Python handler.
#
# bench_start() / bench_done() bound the measured region — the driver
# script times the wall-clock delta between the two SENTINEL lines.

intercepts:

# --- payload ---------------------------------------------------------------
- class: halucinator.bp_handlers.sentinel_log.CounterVirt
  function: slice_probe
  symbol: slice_probe

# --- sentinels -------------------------------------------------------------
- class: halucinator.bp_handlers.sentinel_log.SentinelLog
  function: bench_start
  symbol: bench_start
  registration_args: {tag: "SLICE_START"}

- class: halucinator.bp_handlers.sentinel_log.SentinelLog
  function: bench_done
  symbol: bench_done
  registration_args: {tag: "SLICE_DONE"}

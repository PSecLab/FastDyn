memories:
  # ROM image, mapped at both the alias (0x0) and the flash (0x08000000) locations
  # Paths relative to cwd — always cd to the microbench dir before invoking halucinator.
  alias: {base_addr: 0x0,        file: build/microbench_slice.bin, permissions: r-x, size: 0x100000}
  flash: {base_addr: 0x08000000, file: build/microbench_slice.bin, permissions: r-x, size: 0x200000}
  # STM32F429 SRAM: 192K starting at 0x20000000
  ram:         {base_addr: 0x20000000, size: 0x30000}
  # HALucinator's scratch peripheral for peripheral models
  halucinator: {base_addr: 0x30000000, size: 0x10000000}

peripherals:
  # Broad generic peripheral covers everything from GPIO/RCC/USART1 up
  # (0x40000000..0x60000000). Any MMIO the firmware still emits after
  # our intercepts skip uart_init/uart_send_string will silently succeed.
  logger: {base_addr: 0x40000000, emulate: GenericPeripheral, permissions: rw-, size: 0x20000000}

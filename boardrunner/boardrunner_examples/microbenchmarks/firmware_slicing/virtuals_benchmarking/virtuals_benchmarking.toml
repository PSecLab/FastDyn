# ==============================================================================
#   Microbenchmark: virtual-instruction dispatch overhead (wall-clock)
#
#   Same firmware and same timing markers as the modifier microbench, so
#   subtracting the two gives modifier-vs-virtual cost:
#
#       modifier hit (`r0 0`)   = inline TCG register update  (cheapest modifier)
#       virtual  hit (bench_noop) = per-insn callback dispatch (cheapest virtual)
#
#   Flow (microbench.c, BENCH_SLICE):
#       bench_start();                       <- benchmark_start: capture t0
#       for (i=0; i<N_OUTER; i++)
#         for (j=0; j<N_INNER; j++)
#           slice_probe();                   <- bench_noop virtual fires here
#       bench_done();                        <- benchmark_end: t1, print delta
#       while (1);                           <- Ctrl-C / timeout
#
#   Symbol PCs (from `arm-none-eabi-nm build/microbench_slice.axf`):
#       slice_probe = 0x080001ac
#       bench_start = 0x080001ba
#       bench_done  = 0x080001c8
#
#   Output (stdout):
#       [BENCH][slice_virtual] elapsed_ns=<N> elapsed_us=<X> elapsed_s=<Y>
# ==============================================================================

# ------------------------------ Memory ---------------------------------------
[Memory]

[Memory.main]
id           = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "../qemu/ws/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]
id           = "ram1"
index        = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "../qemu/ws/my_m4_ram"
share        = true
prealloc     = false

# ------------------------------ Machine --------------------------------------
[Machine]
platform            = "STM32F429"
qemu_path           = "../qemu/build/qemu-system-arm"
enable_gdb          = false
stop_on_start       = false
launch_gdb          = false
monitor_port        = 5555
qmp_socket          = "/tmp/qmp-microbench.sock"
log_file            = "qemu.log"
log_options         = "none"
semihosting         = true
semihosting_config  = "enable=on,target=native"
coverage            = false
finline             = "None"
print_command       = true

# ------------------------------ CPU ------------------------------------------
[CPU]
[[CPU.cpu0]]
arch                 = "arm"
machine              = "cortexm"
cpu                  = "cortex-m4"
plugin_library       = "build/libfastdyn.so"
monitor_elf          = "../qemu/ws/monitor.elf"
binary               = "boardrunner/boardrunner_examples/microbenchmarks/firmware_slicing/firmware/build/microbench_slice.axf"
init_nsvtor          = "0x08000000"
twintrace            = "None"
hardware_trace       = "hardware_log/io.log"
introspect           = false
existing_config_path = false

# --- Timing markers (identical to the modifier config) ---
[[CPU.cpu0.virtuals]]
at          = "0x080001ba"           # bench_start
instruction = "benchmark_start"
args        = [""]

[[CPU.cpu0.virtuals]]
at          = "0x080001c8"           # bench_done
instruction = "benchmark_end"
args        = ["slice_virtual"]

# --- The virtual under test ---
# bench_tick is a minimal-work callback: increments a plugin-static counter.
# Prevents dead-code elimination and lets benchmark_end print `hits=<N>` for
# a cross-check that the virtual fired exactly N_OUTER * N_INNER times.
[[CPU.cpu0.virtuals]]
at          = "0x080001ac"           # slice_probe entry
instruction = "bench_tick"
args        = [""]

# No modifiers in this config - virtuals-only measurement.

# ------------------------------ Devices --------------------------------------
[Device.Models.classic]
[Device.Models.unhandled]

[Device.remaining_space]
ranges      = [["0x40000000", "0x400107FF"], ["0x40010C00", "0x40010FFF"], ["0x40011400", "0xE0000000"], ["0xE0000000", "0xEFFFFFFF"]]
irq         = [["1", "100"]]
description = "Unmodeled MMIO - no handlers active for this microbench."

  [[Device.remaining_space.handlers]]
  model   = "classic"
  enabled = false

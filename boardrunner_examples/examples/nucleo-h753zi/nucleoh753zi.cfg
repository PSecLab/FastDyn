# -----------------------------------------------------------------------------
# STM32H753ZI Nucleo Flash Script
# -----------------------------------------------------------------------------
# Interface: ST-Link V3
# Target:    STM32H753ZI (Cortex-M7, Dual-bank flash)
# -----------------------------------------------------------------------------

# Use ST-LINK interface
source [find interface/stlink.cfg]

# Target definition (works for H753 as well as H743)
source [find target/stm32h7x_dual_bank.cfg]

# Use a safe speed for connection
adapter speed 4000

# Reset behavior suitable for Nucleo boards
reset_config srst_only srst_nogate connect_assert_srst

# Initialize OpenOCD and the target
init
# reset
reset halt

# --- MODIFY THIS LINE --------------------------------------------------------
# Path to your ELF or BIN file
# program /home/michael/rooney/FastDyn/boardrunner_examples/examples/nucleo-h753zi/gpio/firmwares/nucleoh753zi_gpio.elf verify reset exit
program /home/michael/rooney/FastDyn/boardrunner_examples/examples/nucleo-h753zi/server/firmwares/nucleoh753zi_server.elf verify reset exit
